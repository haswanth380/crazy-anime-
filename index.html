<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crazy Anime - Stream Anime & Cartoons</title>
  <style>
    :root {
      --bg-black: #07060b;
      --bg-violet-dark: #130b24;
      --bg-card: #18102b;
      --bg-elevated: #231640;
      --violet-primary: #8b5cf6;
      --violet-bright: #a855f7;
      --violet-glow: rgba(139, 92, 246, 0.35);
      --text-main: #f5f3ff;
      --text-muted: #b7aed4;
      --border-violet: rgba(168, 85, 247, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top right, #1e1038 0%, var(--bg-black) 55%);
      background-color: var(--bg-black);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 6, 11, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-violet);
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #fff;
      cursor: pointer;
    }

    .brand span {
      color: var(--violet-bright);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .search-input {
      background: var(--bg-elevated);
      border: 1px solid var(--border-violet);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.92rem;
      outline: none;
      min-width: 220px;
    }

    .search-input:focus {
      border-color: var(--violet-bright);
      box-shadow: 0 0 0 2px var(--violet-glow);
    }

    /* Language Filter Bar */
    .lang-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 16px 24px 0;
      max-width: 1320px;
      margin: 0 auto;
    }

    .lang-btn {
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border-violet);
      padding: 6px 15px;
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-btn.active,
    .lang-btn:hover {
      background: linear-gradient(135deg, var(--violet-primary), var(--violet-bright));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 14px var(--violet-glow);
    }

    /* Main Grid */
    main {
      padding: 20px 24px 48px;
      max-width: 1320px;
      margin: 0 auto;
    }

    .section-heading {
      font-size: 1.22rem;
      font-weight: 700;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-main);
    }

    .section-heading::before {
      content: "";
      width: 5px;
      height: 22px;
      background: linear-gradient(180deg, var(--violet-bright), var(--violet-primary));
      border-radius: 3px;
      display: inline-block;
    }

    .poster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
      gap: 20px;
    }

    .poster-card {
      background: linear-gradient(180deg, var(--bg-card) 0%, var(--bg-violet-dark) 100%);
      border: 1px solid var(--border-violet);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
      display: flex;
      flex-direction: column;
    }

    .poster-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 26px var(--violet-glow);
      border-color: var(--violet-bright);
    }

    .poster-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      background: var(--bg-elevated);
      overflow: hidden;
    }

    .poster-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge-season,
    .badge-ep {
      position: absolute;
      top: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(7, 6, 11, 0.85);
      color: #fff;
      border: 1px solid var(--border-violet);
    }

    .badge-season {
      left: 8px;
    }

    .badge-ep {
      right: 8px;
      background: var(--violet-primary);
      border-color: transparent;
    }

    .poster-info {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .poster-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .poster-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(7, 6, 11, 0.86);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 200;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border-violet);
      border-radius: 14px;
      max-width: 780px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .close-btn {
      background: var(--bg-elevated);
      color: var(--text-main);
      border: 1px solid var(--border-violet);
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .close-btn:hover {
      background: var(--violet-bright);
      color: #fff;
    }

    .modal-desc {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: 14px;
    }

    .tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tag-pill {
      font-size: 0.78rem;
      background: var(--bg-elevated);
      color: var(--text-main);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-violet);
    }

    .episodes-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .ep-btn {
      background: var(--bg-elevated);
      color: var(--text-main);
      border: 1px solid var(--border-violet);
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.84rem;
      text-align: left;
    }

    .ep-btn:hover,
    .ep-btn.active {
      background: var(--violet-primary);
      border-color: var(--violet-bright);
      color: #fff;
    }

    .video-frame-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border-violet);
    }

    .video-frame-wrap iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
