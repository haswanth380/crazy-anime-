    nav {
      background-color: #090712;

    .home-btn {
      background: #241b4b; color: #fff; border: 1px solid #7b2cbf;

    }
    .home-btn:hover { background: #7b2cbf; }
    .search-box {
      padding: 8px 16px; width: 230px; border-radius: 20px;

    .banner-poster {

    .banner-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }

      padding: 4px 10px; border-radius: 6px; font-weight: 600;
    }
    .overview-label { font-size: 13px; color: #9d4edd; font-weight: bold; margin-bottom: 4px; }
    .overview-text { font-size: 14px; color: #cfc9e8; line-height: 1.5; margin: 0; }

    .player-wrapper {
      position: relative;
      background: #070510;
      border: 2px solid #8a4fff;
      border-radius: 12px;
      overflow: hidden;
      min-height: 460px;
    }
    .video-frame { width: 100%; height: 460px; border: none; display: block; }
    .embed-note {
      background: #1b1438;
      border-top: 1px solid #3a2975;
      padding: 10px 16px;
      font-size: 12px;
      color: #d8c8ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
