<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crazy Anime</title>
  <style>
    body {
      background-color: #0f0f1a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    header {
      background-color: #ff4757;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 30px;
    }
    h1 { margin: 0; }
    .anime-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
    .anime-card {
      background-color: #1e1e2f;
      border-radius: 10px;
      padding: 15px;
      width: 320px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    iframe {
      width: 100%;
      height: 180px;
      border: none;
      border-radius: 8px;
    }
    h3 { margin: 12px 0 5px; color: #ff6b81; }
    p { font-size: 14px; color: #cccccc; }
  </style>
</head>
<body>

  <header>
    <h1>🔥 Crazy Anime World 🔥</h1>
    <p>Watch Official Anime Episodes Free</p>
  </header>

  <div class="anime-grid">
    <div class="anime-card">
      <iframe src="https://www.youtube.com/embed/tQ0mzXRXRkM" allowfullscreen></iframe>
      <h3>Attack on Titan - Trailer</h3>
      <p>Official Preview</p>
    </div>

    <div class="anime-card">
      <iframe src="https://www.youtube.com/embed/VQGCKyvzIM4" allowfullscreen></iframe>
      <h3>Demon Slayer - Trailer</h3>
      <p>Official Preview</p>
    </div>
  </div>

</body>
</html>
